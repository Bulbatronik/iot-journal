## DDPM model configuration

architecture:
  unet_configs:
    num_features: 10
    seq_len: 20 # window_size
    num_channels: 32
    ch_mults: [1, 2, 2]
    is_attn: [False, False, True]
    num_blocks: 1
    make_divisible_by_2: True

beta_schedule: # Linear schedule
  beta_start: 0.0001
  beta_end: 0.02
  num_timesteps: 1000

optimizer:
  type: 'Adam'
  learning_rate: 0.0001
  betas: [0.9, 0.999]

generation:
  filter_size: null # Placeholder, will be computed after threshold selection
  num_timesteps: 250
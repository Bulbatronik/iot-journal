## TAnoWGAN (WGAN with Gradient Penalty) model configuration

architecture:
  hidden_dims_discriminator: [256, 128]
  hidden_dims_generator: [128, 256]
  latent_dim: 20
  n_critic: 5
  lambda_gp: 10

optimizer:
  type: 'Adam'
  learning_rate: 0.0001
  betas: [0.9, 0.999]

generation:
  filter_size: null # Placeholder, will be computed after threshold selection
  learning_rate: 0.01
  num_steps: 1500
  lmd: 0.1

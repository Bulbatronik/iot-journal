architecture:
  conditioning_length: null   # null -> defaults to window_size // 2 (10/10 conditioning/target split)
  hidden_dims_generator: [64, 128, 128]
  hidden_dims_discriminator: [128, 128]
  predictor_hidden_dim: 128
  predictor_num_layers: 2
  kernel_size: 3
  dilations: [1, 2, 4]
  generator_dropout: 0.1
  discriminator_dropout: 0.1
  predictor_dropout: 0.1
  negative_slope: 0.2
  n_critic: 5
  lambda_gp: 10.0
  generator_noise_std: 1.0
  recon_loss_weight: 0.0

optimizer:
  type: Adam
  learning_rate: 0.0001
  betas: [0.5, 0.999]

generation:
  filter_size: null
  alpha: 0.35
  beta: 0.15
  gamma: 0.5
  num_samples: 1
  generator_noise_std: 1.0
  blank_fill_value: 0.0

